<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farashti">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Farashti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, bottom tab bar like a native app. Deliberate single matte-dark look. Arabic (RTL) and English (LTR). */
:root{
  --bg:#131417; --surface:#1B1D21; --raised:#23262B; --fg:#EDEEF0; --muted:#949AA3; --line:#2B2F35;
  --accent:#FF5C86; --accent-ink:#1A0C11; --accent-soft:#3A1E27;
  --teal:#45D1B2; --teal-soft:#16302B; --warn:#F5B547; --warn-soft:#352B16;
  --display:"Archivo","Readex Pro","Arial Narrow",Arial,sans-serif;
  --body:"Figtree","IBM Plex Sans Arabic","Segoe UI",Roboto,Arial,sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
html[dir="rtl"] body{line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.01em}
h1{font-size:34px;font-weight:900;font-stretch:75%;text-transform:uppercase}
h2{font-size:21px;font-weight:800;font-stretch:80%;text-transform:uppercase}
h3{font-size:15px;font-weight:700}
html[dir="rtl"] h1{font-size:30px;letter-spacing:0}
html[dir="rtl"] h2{font-size:19px;letter-spacing:0}
p{margin:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
html[dir="rtl"] .eyebrow{letter-spacing:0;font-size:12.5px}
.muted{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11.5px}
.brand svg{width:22px;height:22px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.teal{background:var(--teal-soft);color:var(--teal)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--raised);border-radius:12px;padding:10px 6px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
button,.btn{font-family:var(--body);font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--raised);color:var(--fg);border-radius:12px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--accent-ink)!important}
.small{padding:6px 10px;font-size:12.5px;border-radius:10px}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langsw button{border:0;border-radius:0;background:transparent;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.energy{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.energy button{padding:8px 0;flex-direction:column;gap:0;font-size:11.5px;font-weight:600}
.energy button b{font-family:var(--display);font-size:22px;font-weight:800}
.energy button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--teal-soft);color:var(--fg)}
.note.warn{background:var(--warn-soft)}
.note.pink{background:var(--accent-soft)}
ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.checks li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
ul.checks li:first-child{border-top:0}
ul.checks input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
ul.checks label{flex:1;min-width:0;cursor:pointer}
ul.checks .sets{font-family:var(--display);font-weight:700;font-size:14px;color:var(--teal);white-space:nowrap}
ul.checks li.done label{text-decoration:line-through;color:var(--muted)}
.tip{font-size:12.5px;color:var(--muted);display:block}
.progress{height:6px;background:var(--raised);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.water{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.water button{height:40px;padding:0;border-radius:8px}
.water button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--line);border-radius:10px;padding:7px 2px;text-align:center;font-size:10.5px;font-weight:600;background:var(--raised);cursor:pointer;min-width:0;flex-direction:column;gap:0;color:var(--muted)}
.day b{display:block;font-family:var(--display);font-size:13px;font-weight:800;color:var(--fg);text-transform:uppercase}
.day.str{border-color:var(--accent-soft);background:var(--accent-soft)}
.day.act{border-color:var(--teal-soft);background:var(--teal-soft)}
.day.sel{outline:2px solid var(--accent)}
.day.today b{text-decoration:underline;text-underline-offset:3px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:start;padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-top:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td.n,ul.checks .sets{direction:ltr;unicode-bidi:isolate}
html[dir="rtl"] td.n{text-align:right}
.tbl{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 120px}
.card>.field{flex:none}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input,select{font-family:var(--body);font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--fg);width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.tl .it:first-child{border-top:0}
.tl .t{font-family:var(--display);font-weight:800;font-size:15px;color:var(--teal)}
.tl .it.med .t{color:var(--accent)}
.tl .m{font-size:12.5px;color:var(--muted)}
.rem{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.rem .t{font-family:var(--display);font-weight:800;color:var(--teal)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%}
nav.tabs button{border:0;border-radius:0;background:none;padding:10px 0 12px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);flex-direction:column;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
nav.tabs button[aria-current="page"]{color:var(--accent)}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.disc{font-size:11.5px;color:var(--muted);text-align:center}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>

<script>
(function(){
/* ---------- storage ---------- */
const KEY='farashti.v2';
const todayKey=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function loadOld(){try{return JSON.parse(localStorage.getItem('hashifit.v1'))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const DEF={age:42,weight:70,height:159,medName:'Levothyroxine',dose:'',medTime:'07:00',workTime:'09:00',sunday:'U'};
let S=load();
if(!S){const o=loadOld();S={profile:Object.assign({},DEF),days:{},weights:[{d:todayKey(),w:70,waist:''}],labs:[],tab:'today'};
  if(o){['age','weight','height','dose','medTime'].forEach(k=>{if(o.profile&&o.profile[k])S.profile[k]=o.profile[k]});
    if(o.weights&&o.weights.length)S.weights=o.weights; if(o.labs)S.labs=o.labs;}}
S.profile=Object.assign({},DEF,S.profile);
if(!S.lang)S.lang='ar';
function dayLog(k){k=k||todayKey();if(!S.days[k])S.days[k]={energy:0,ex:{},med:{},water:0};return S.days[k]}

/* ---------- language ---------- */
const AR=()=>S.lang==='ar';
const t=(en,ar)=>AR()?ar:en;              // inline strings
const tx=x=>Array.isArray(x)?(AR()&&x[1]!=null?x[1]:x[0]):(x||''); // data strings [en, ar]
function applyLang(){const h=document.documentElement;h.lang=S.lang;h.dir=AR()?'rtl':'ltr'}

/* ---------- workouts: {n:[en,ar], s:[en,ar]|str, tip:[en,ar]} ---------- */
const E=(n,s,tip,fin)=>({n,s,tip,fin});
const WD=[['Sunday','الأحد'],['Monday','الاتنين'],['Tuesday','التلات'],['Wednesday','الأربع'],['Thursday','الخميس'],['Friday','الجمعة'],['Saturday','السبت']];
const WORK={
 L1:{name:['Lower — Glutes & Quads','سفلي — أرداف وفخذ أمامي'],kind:'str',ex:[
  E(['Goblet or back squat','سكوات جوبلت أو بالبار'],'4 × 8–10',['Thighs parallel to the floor, chest up','الفخذ موازي للأرض والصدر لفوق']),
  E(['Hip thrust (barbell)','هيب ثرست بالبار'],'4 × 10–12',['Squeeze 2 seconds at the top','اضغطي الأرداف فوق ثانيتين']),
  E(['Romanian deadlift (dumbbells)','رومانيان ديدلفت بالدمبل'],'3 × 10',['Hinge from the hips, soft knees','الحركة من الوسط والركبة مثنية سنة']),
  E(['Walking lunges','لانجز مشي'],['3 × 12 / leg','3 × 12 لكل رجل']),
  E(['Leg curl machine','ليج كيرل على الجهاز'],'3 × 12'),
  E(['Plank','بلانك'],['3 × 40 s','3 × 40 ث'])]},
 L2:{name:['Lower — Posterior Chain','سفلي — خلفي وأرداف'],kind:'str',ex:[
  E(['Deadlift (trap bar or dumbbells)','ديدلفت (تراب بار أو دمبل)'],'4 × 6–8',['Heaviest day of the week. Form before load','أتقل يوم في الأسبوع. الفورم قبل الوزن']),
  E(['Bulgarian split squat','بلغاري سبليت سكوات'],['3 × 10 / leg','3 × 10 لكل رجل']),
  E(['Leg press (feet high & wide)','ليج بريس (رجل فوق وعريضة)'],'3 × 12'),
  E(['Hip abduction machine','هيب أبدكشن على الجهاز'],'3 × 15'),
  E(['Standing calf raise','سمانة واقف'],'3 × 15'),
  E(['Dead bug','ديد بَج'],['3 × 10 / side','3 × 10 لكل جنب'],['Lower back pressed to the floor','ضهرك لازق في الأرض'])]},
 U1:{name:['Upper — Push Focus','علوي — تركيز دفع'],kind:'str',ex:[
  E(['Dumbbell bench press','ضغط صدر بالدمبل'],'4 × 8–10'),
  E(['Lat pulldown','لات بول داون'],'3 × 10',['Pull to upper chest','اسحبي لحد أعلى الصدر']),
  E(['Seated dumbbell shoulder press','ضغط كتف بالدمبل جالسة'],'3 × 10'),
  E(['Incline push-ups','ضغط على بنش'],['3 × max clean reps','3 × أقصى عدد بفورم سليم']),
  E(['Lateral raise','رفرفة جانبي'],'3 × 15',['Light weight, slow','وزن خفيف وببطء']),
  E(['Triceps rope pushdown','تراي حبل على الكابل'],'3 × 12')]},
 U2:{name:['Upper — Pull Focus','علوي — تركيز سحب'],kind:'str',ex:[
  E(['Lat pulldown or assisted pull-up','لات بول داون أو عقلة بمساعدة'],'4 × 8–10'),
  E(['Seated cable row','سحب كابل جالس'],'3 × 12',['Shoulders back and down','الكتف لورا وتحت']),
  E(['One-arm dumbbell row','تجديف دمبل بإيد واحدة'],['3 × 12 / arm','3 × 12 لكل إيد']),
  E(['Incline dumbbell press','ضغط دمبل مائل'],'3 × 10'),
  E(['Face pull','فيس بول'],'3 × 15',['Great for neck and posture','مهم للرقبة ووضع الكتف']),
  E(['Dumbbell biceps curl','باي دمبل'],'3 × 12')]},
 F:{name:['Full Body Strength','جسم كامل — قوة'],kind:'str',ex:[
  E(['Goblet squat','سكوات جوبلت'],'3 × 10'),
  E(['Push-ups (incline if needed)','ضغط (على بنش لو محتاجة)'],['3 × max clean reps','3 × أقصى عدد بفورم سليم']),
  E(['One-arm dumbbell row','تجديف دمبل بإيد واحدة'],['3 × 12 / arm','3 × 12 لكل إيد']),
  E(['Step-ups with dumbbells','ستيب أب بالدمبل'],['3 × 10 / leg','3 × 10 لكل رجل']),
  E(['Kettlebell swing','كتل بل سوينج'],'3 × 15'),
  E(['Farmer carry','فارمر كاري'],['3 × 40 m','3 × 40 متر'],['Heavy, tall posture','وزن تقيل وضهر مفرود']),
  E(['Bike intervals: 30 s hard / 90 s easy','إنترفال عجلة: 30 ث سريع / 90 ث هادي'],['6 rounds','6 جولات'],['Only if energy is 4 or 5','بس لو طاقتك 4 أو 5'],1)]},
 W:{name:['Walk + Mobility','مشي + موبيليتي'],kind:'act',ex:[
  E(['Brisk walk, zone 2 (you can talk, not sing)','مشي سريع Zone 2 (تقدري تتكلمي بس مش تغني)'],['40–50 min','40–50 دقيقة'],['Aim for 8,000–10,000 steps today','هدفك 8000–10000 خطوة النهارده']),
  E(['Hip & spine mobility: cat-cow, 90/90, hip flexor stretch','موبيليتي للحوض والضهر: Cat-Cow و 90/90 واستطالة الحوض'],['10 min','10 دقايق']),
  E(['Light core: bird dog + side plank','كور خفيف: بيرد دوج + سايد بلانك'],['2 × 10 / 2 × 25 s','2 × 10 / 2 × 25 ث'])]},
 R:{name:['Rest Day','يوم راحة'],kind:'rest',ex:[
  E(['Sleep 7–8 hours. Easy stroll if you feel like it','نوم 7–8 ساعات، وتمشية خفيفة لو حابة'],'—',['With Hashimoto’s, recovery is where the muscle gets built','مع الهاشيموتو، العضلة بتتبني وانتي مرتاحة'])]}
};
function planKey(dow){return {6:'W',0:S.profile.sunday==='F'?'F':'U2',1:'L1',2:'U1',3:'L2',4:'W',5:'R'}[dow]}

/* ---------- nutrition ---------- */
function calc(){
  const p=S.profile,w=+p.weight||70,h=+p.height||159,a=+p.age||42;
  const bmr=Math.round(10*w+6.25*h-5*a-161), f=1.55, tdee=Math.round(bmr*f);
  const cal=Math.max(1400,Math.round(tdee*0.82/10)*10);
  const prot=Math.round(1.8*w), fat=Math.round(0.8*w), carb=Math.max(80,Math.round((cal-prot*4-fat*9)/4));
  return {bmr,f,tdee,cal,prot,fat,carb,bmi:(w/Math.pow(h/100,2)).toFixed(1)};
}
const toMin=s=>{const[a,b]=(s||'00:00').split(':').map(Number);return a*60+b};
const fmt=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function timeline(){
  const med=toMin(S.profile.medTime), wk=toMin(S.profile.workTime);
  const coffee=Math.max(med+45,wk-30), bf=wk+75;
  return {med,coffee,wk,bf,items:[
   {id:'med',t:med,med:1,n:['Thyroid medication','دوا الغدة'],d:['Empty stomach, plain water only. No food or coffee yet.','على معدة فاضية بكوباية مية بس. لا أكل ولا قهوة.']},
   {id:'coffee',t:coffee,n:['Coffee','القهوة'],d:['Black or with a splash of milk. This is your pre-workout. At least 45 min after the pill.','سادة أو بنقطة لبن. دي البري وركاوت بتاعتك. بعد الدوا بـ 45 دقيقة على الأقل.']},
   {id:'workout',t:wk,n:['Train (fasted)','التمرين (صايمة)'],d:['Sip water during the session. Keep a date nearby if you feel dizzy.','اشربي مية أثناء التمرين. خلي معاكي تمرة لو حسيتي بدوخة.']},
   {id:'breakfast',t:bf,k:450,pr:32,n:['Breakfast — post-workout','الفطار — بعد التمرين'],d:['2 whole eggs + 3 egg whites, 2 slices wholegrain toast, cucumber & tomato, 1 piece of fruit','2 بيضة كاملة + 3 بياض، شريحتين توست أسمر، خيار وطماطم، وحباية فاكهة']},
   {id:'lunch',t:bf+240,k:575,pr:50,n:['Lunch','الغدا'],d:['150 g grilled chicken breast (or tilapia / lean beef) + 150 g cooked rice (or potato) + big salad + 1 tbsp olive oil','150 جم صدور فراخ مشوية (أو بلطي / لحمة قليلة الدهن) + 150 جم رز مطبوخ (أو بطاطا) + سلطة كبيرة + معلقة زيت زيتون']},
   {id:'snack',t:bf+420,k:215,pr:19,ca:1,n:['Snack','سناك'],d:['170 g Greek yogurt + 1 cup berries + 2 Brazil nuts (selenium)','170 جم زبادي يوناني + كوب فراولة أو توت + 2 بندق برازيلي (سيلينيوم)']},
   {id:'dinner',t:bf+600,k:340,pr:31,n:['Dinner','العشا'],d:['200 g cottage cheese + vegetables + ½ baladi bread (or 3 tbsp ful with olive oil)','200 جم جبنة قريش + خضار + نص رغيف بلدي (أو 3 معالق فول بزيت زيتون)']}
  ]};
}

/* ---------- reminders (calendar) ---------- */
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const ICSD=['SU','MO','TU','WE','TH','FR','SA'];
function reminders(){
  const tl=timeline(),ico={med:'💊',coffee:'☕'};
  const r=tl.items.filter(i=>i.id!=='workout').map(i=>({id:i.id,t:i.t,title:(ico[i.id]||'🍽')+' '+tx(i.n),desc:tx(i.d),days:''}));
  r.push({id:'lift',t:tl.wk,title:'🏋️ '+t('Strength session','تمرين حديد'),desc:t('Open Farashti and log your energy first.','افتحي فراشتي وسجلي طاقتك الأول.'),days:'SU,MO,TU,WE'});

function firstDate(days){
  const d=new Date(); if(!days) return d;
  for(let i=0;i<7;i++){const x=new Date();x.setDate(d.getDate()+i);if(days.split(',').includes(ICSD[x.getDay()]))return x}
  return d;
}
const stamp=(d,m)=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+fmt(m).replace(':','')+'00';
const rrule=days=>days?'RRULE:FREQ=WEEKLY;BYDAY='+days:'RRULE:FREQ=DAILY';
function gcal(r){
  const d=firstDate(r.days);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(r.title)+'&details='+encodeURIComponent(r.desc)+'&dates='+stamp(d,r.t)+'/'+stamp(d,r.t+10)+'&recur='+encodeURIComponent(rrule(r.days));
}
function ics(){
  const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=reminders().map(r=>{const d=firstDate(r.days);return ['BEGIN:VEVENT','UID:farashti-'+r.id+'@farashti','DTSTAMP:'+now,'DTSTART:'+stamp(d,r.t),'DTEND:'+stamp(d,r.t+10),rrule(r.days),'SUMMARY:'+r.title,'DESCRIPTION:'+r.desc.replace(/[,;]/g,'\\$&'),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+r.title,'TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n')});
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Farashti//EN','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n');
}

function adjust(energy,w){
  if(w.kind!=='str') return {};

  if(energy===3) return {label:t('Steady','متوسط'),cls:'warn',note:t('Same weights, leave 3 reps in the tank (RPE 7). Skip any finisher.','نفس الأوزان وسيبي 3 عدات في الخزان (RPE 7). شيلي الإنترفال.')};
  if(energy===2) return {label:t('Light','خفيف'),cls:'warn',minus:1,note:t('One set less per exercise and about 20% lighter. Move without draining yourself.','جولة أقل في كل تمرين ووزن أخف بحوالي 20٪. اتحركي من غير ما تستنزفي.')};
  if(energy===1) return {label:t('Recovery','استشفاء'),swap:true,note:t('No weights today. 20–30 min walk and stretching. If this fatigue lasts over two weeks, get your TSH checked.','النهارده بلاش حديد. مشي 20–30 دقيقة واستطالات. لو التعب ده استمر أكتر من أسبوعين اعملي تحليل TSH.')};
  return {note:t('Rate your energy above and I’ll adjust today’s session.','سجلي طاقتك فوق وأنا أظبطلك تمرين النهارده.')};
}

    :`<p class="note">${t('One tap adds all reminders to your phone’s calendar with an alert on time, every day.','دوسة واحدة تضيف كل التنبيهات لتقويم تليفونك وينبهك في الميعاد كل يوم.')}</p>
      <button class="primary" id="icsBtn">${t('Add all reminders to my calendar','ضيفي كل التنبيهات للتقويم')}</button>
      <p class="muted">${t('iPhone: tap <b>Add All</b> when Calendar opens. Android: open the file with Google Calendar, or use the Add buttons below.','أيفون: دوسي <b>Add All</b> لما التقويم يفتح. أندرويد: افتحي الملف بـ Google Calendar أو استخدمي زراير الإضافة تحت.')}</p>`}
   <div>
    ${rs.map(r=>`<div class="rem"><span class="t num">${fmt(r.t)}</span><div><h3>${r.title}</h3><span class="muted">${r.days?r.days.split(',').map(dayName).join(' · '):t('Every day','كل يوم')}</span></div><a class="btn small" href="${gcal(r)}" target="_blank" rel="noopener">${t('Add','إضافة')}</a></div>`).join('')}
   </div>
   <p class="muted">${t('Changed your pill or training time? Delete the old reminders in your calendar and add them again.','غيرتي ميعاد الدوا أو التمرين؟ امسحي التنبيهات القديمة من التقويم وضيفيها تاني.')}</p>
  </section>

  <section class="card">
   <h2>${t('Pill rules','قواعد الدوا')}</h2>
   <ul class="checks">
    <li><label>${t('Empty stomach, glass of water, <b>45–60 min</b> before food or coffee.','معدة فاضية وكوباية مية، و<b>45–60 دقيقة</b> قبل الأكل أو القهوة.')}</label></li>
    <li><label>${t('Calcium, iron, multivitamins, antacids: <b>4 hours later</b>.','الكالسيوم والحديد والملتي فيتامين ومضادات الحموضة: <b>بعده بـ 4 ساعات</b>.')}</label></li>
    <li><label>${t('Missed it? Take it when you remember that day. Never double up without asking your doctor.','نسيتيه؟ خديه أول ما تفتكري في نفس اليوم. ما تاخديش جرعتين مع بعض من غير ما تسألي دكتورك.')}</label></li>
    <li><label>${t('Blood test day: test in the morning before the pill. Stop biotin (hair supplements) 2 days before, it skews results.','يوم التحليل: اعمليه الصبح قبل الدوا. وقفي البيوتين (مكملات الشعر) قبلها بيومين لأنه بيلخبط النتيجة.')}</label></li>
   </ul>
  </section>

  <section class="card">
   <h2>${t('Lab results','التحاليل')}</h2>
   <div class="row">
    <div class="field"><label for="l-d">${t('Date','التاريخ')}</label><input id="l-d" type="date" value="${todayKey()}"></div>
    <div class="field"><label for="l-tsh">TSH (mIU/L)</label><input id="l-tsh" inputmode="decimal" placeholder="2.1"></div>
    <div class="field"><label for="l-t4">Free T4</label><input id="l-t4" inputmode="decimal" placeholder="${t('optional','اختياري')}"></div>
   </div>
   <button class="primary" id="addLab">${t('Save result','احفظي التحليل')}</button>
   ${S.labs.length?`<div class="tbl"><table><thead><tr><th>${t('Date','التاريخ')}</th><th>TSH</th><th>Free T4</th><th></th></tr></thead><tbody>
    ${S.labs.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(l=>`<tr><td class="n">${l.d}</td><td class="n">${esc(l.tsh)}</td><td class="n">${esc(l.t4||'—')}</td><td><button class="small" data-dellab="${l.id}" aria-label="${t('Delete','امسحي')}">✕</button></td></tr>`).join('')}
   </tbody></table></div>`:`<p class="muted">${t('No results yet. Add your latest TSH to start tracking.','لسه مفيش تحاليل. سجلي آخر TSH عشان تتابعي.')}</p>`}
   <p class="muted">${t('TSH is usually rechecked 6–8 weeks after a dose change, then every 6–12 months once stable. Your doctor sets the target.','الـ TSH بيتعاد عادة بعد 6–8 أسابيع من أي تغيير في الجرعة، وبعدين كل 6–12 شهر. الرقم المستهدف بيحدده دكتورك.')}</p>
  </section>
  <section class="card">
   <h2>${t('Ask your doctor about','اسألي دكتورك عن')}</h2>
   <p>${t('Vitamin D · Ferritin · B12 · Anti-TPO · Fasting glucose. Low levels of any of these cause fatigue and stall fat loss even when TSH looks fine.','فيتامين د · فيريتين · B12 · Anti-TPO · سكر صايم. نقص أي واحد فيهم بيعمل تعب ويوقف نزول الدهون حتى لو الـ TSH مظبوط.')}</p>
  </section>
  ${disc()}`;
}

function viewProgress(){
  const ws=S.weights.slice().sort((a,b)=>a.d.localeCompare(b.d)),last=ws[ws.length-1],first=ws[0];
  const diff=last&&first?(last.w-first.w).toFixed(1):0;
  let sessions=0;for(let i=0;i<28;i++){const d=new Date();d.setDate(d.getDate()-i);const L=S.days[todayKey(d)];if(L&&Object.values(L.ex).some(Boolean))sessions++}
  const p=S.profile;
  return `${topbar()}
  <header class="top"><div><p class="eyebrow">${t('Tape and strength beat the scale','المقاس والقوة أهم من الميزان')}</p><h1>${t('Progress','التقدم')}</h1></div></header>
  <section class="card">
   <div class="stats">
    <div class="stat"><b>${last?last.w:'—'}</b><span>${t('kg now','كجم دلوقتي')}</span></div>
    <div class="stat"><b dir="ltr">${diff>0?'+':''}${diff}</b><span>${t('since start','من البداية')}</span></div>
    <div class="stat"><b>${last&&last.waist?last.waist:'—'}</b><span>${t('waist cm','الوسط سم')}</span></div>
    <div class="stat"><b>${sessions}</b><span>${t('active / 28d','يوم / 28')}</span></div>
   </div>
   ${chart(ws)}
  </section>
  <section class="card">
   <h2>${t('Log weight','سجلي وزنك')}</h2>
   <div class="row">
    <div class="field"><label for="w-d">${t('Date','التاريخ')}</label><input id="w-d" type="date" value="${todayKey()}"></div>
    <div class="field"><label for="w-w">${t('Weight kg','الوزن كجم')}</label><input id="w-w" inputmode="decimal" placeholder="70"></div>
    <div class="field"><label for="w-s">${t('Waist cm','الوسط سم')}</label><input id="w-s" inputmode="decimal" placeholder="${t('optional','اختياري')}"></div>
   </div>
   <button class="primary" id="addW">${t('Save','احفظي')}</button>
   <p class="muted">${t('Weigh once a week, same day, in the morning before the pill. Weight jumps around your period.','اوزني نفسك مرة في الأسبوع، نفس اليوم، الصبح قبل الدوا. الوزن بيتلخبط أيام الدورة.')}</p>
  </section>
  <section class="card">
   <h2>${t('Your details','بياناتك')}</h2>
   <div class="row">
    <div class="field"><label for="p-a">${t('Age','السن')}</label><input id="p-a" data-p="age" inputmode="numeric" value="${p.age}"></div>
    <div class="field"><label for="p-w">${t('Weight kg','الوزن كجم')}</label><input id="p-w" data-p="weight" inputmode="decimal" value="${p.weight}"></div>
    <div class="field"><label for="p-h">${t('Height cm','الطول سم')}</label><input id="p-h" data-p="height" inputmode="numeric" value="${p.height}"></div>
   </div>
   <p class="muted">${t('Calories and protein update when you change these.','السعرات والبروتين بيتحسبوا من جديد لما تغيري دول.')}</p>
  </section>
  ${disc()}`;
}

function chart(ws){
  if(ws.length<2) return `<p class="muted">${t('Log at least two weigh-ins to see your trend.','سجلي وزنين على الأقل عشان يظهر الرسم.')}</p>`;
  const W=320,H=120,pad=26,vals=ws.map(x=>+x.w),mn=Math.min(...vals)-0.5,mx=Math.max(...vals)+0.5;
  const X=i=>pad+(W-pad*2)*i/(ws.length-1),Y=v=>12+(H-34)*(1-(v-mn)/(mx-mn));
  const pts=ws.map((x,i)=>X(i)+','+Y(+x.w)).join(' '),lx=X(ws.length-1),ly=Y(vals[vals.length-1]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight" dir="ltr">
   <line x1="${pad}" x2="${W-pad}" y1="${Y(mx-0.5)}" y2="${Y(mx-0.5)}" stroke="var(--line)"/>
   <line x1="${pad}" x2="${W-pad}" y1="${Y(mn+0.5)}" y2="${Y(mn+0.5)}" stroke="var(--line)"/>
   <text x="2" y="${Y(mx-0.5)+3}">${(mx-0.5).toFixed(1)}</text><text x="2" y="${Y(mn+0.5)+3}">${(mn+0.5).toFixed(1)}</text>
   <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${lx}" cy="${ly}" r="4.5" fill="var(--accent)"/>
   <text x="${X(0)}" y="${H-4}" text-anchor="middle">${ws[0].d.slice(5)}</text><text x="${lx}" y="${H-4}" text-anchor="middle">${ws[ws.length-1].d.slice(5)}</text>
  </svg>`;
}
function disc(){return `<p class="disc">${t('Farashti is for planning and motivation, not medical advice. Dose or supplement changes go through your doctor.','فراشتي للتنظيم والتحفيز ومش بديل عن الدكتور. أي تغيير في الجرعة أو المكملات لازم يكون بإشرافه.')}</p>`}

/* ---------- tabs ---------- */
const TABS=[
 ['today',['Today','النهارده'],'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',viewToday],
 ['train',['Train','التمارين'],'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',viewTrain],
 ['food',['Food','الأكل'],'<path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M12 7c0-2 2-2 2-4"/>',viewFood],
 ['med',['Meds','العلاج'],'<path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="12" r="8.5"/>',viewMed],
 ['progress',['Progress','التقدم'],'<path d="M4 19h16M6 15l4-4 3 3 5-6"/>',viewProgress]
];
function render(){
  applyLang();
  const tb=TABS.find(x=>x[0]===S.tab)||TABS[0];
  $('#app').innerHTML=tb[3]();
  $('#tabs').innerHTML=TABS.map(x=>`<button data-tab="${x[0]}" ${x[0]===tb[0]?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${x[2]}</svg>${tx(x[1])}</button>`).join('');
}
function go(tab){S.tab=tab;save();render();window.scrollTo(0,0)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset,L=dayLog();
  if(d.tab) return go(d.tab);
  if(d.go) return go(d.go);
  if(d.lang){S.lang=d.lang;save();return render()}
  if(d.energy){L.energy=+d.energy;save();return render()}
  if(d.water){const n=+d.water;L.water=L.water===n?n-1:n;save();return render()}
  if(d.sun){S.profile.sunday=d.sun;save();return render()}
  if(d.day){selDay=+d.day;return render()}
  if(d.dellab){S.labs=S.labs.filter(l=>String(l.id)!==d.dellab);save();return render()}
  if(b.id==='icsBtn'){location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics());return}
  if(b.id==='addLab'){const tsh=$('#l-tsh').value.trim();if(!tsh){$('#l-tsh').focus();return}
    S.labs.push({id:Date.now(),d:$('#l-d').value||todayKey(),tsh,t4:$('#l-t4').value.trim()});save();return render()}
  if(b.id==='addW'){const w=parseFloat($('#w-w').value);if(!w){$('#w-w').focus();return}
    const dd=$('#w-d').value||todayKey();S.weights=S.weights.filter(x=>x.d!==dd);
    S.weights.push({d:dd,w,waist:$('#w-s').value.trim()});
    if(dd>=S.weights.map(x=>x.d).sort().slice(-1)[0])S.profile.weight=w;save();return render()}
});
document.addEventListener('change',e=>{
  const el=e.target,L=dayLog();
  if(el.dataset.med){L.med[el.dataset.med]=el.checked;save();return render()}
  if(el.dataset.ex){L.ex[el.dataset.ex]=el.checked;save();return render()}
  if(el.dataset.p){S.profile[el.dataset.p]=el.value;save();if(el.type==='time')render()}
});
render();
})();
</script>
