<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farashti">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Farashti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, bottom tab bar like a native app. Deliberate single matte-dark look. */
:root{
  --bg:#131417; --surface:#1B1D21; --raised:#23262B; --fg:#EDEEF0; --muted:#949AA3; --line:#2B2F35;
  --accent:#FF5C86; --accent-ink:#1A0C11; --accent-soft:#3A1E27;
  --teal:#45D1B2; --teal-soft:#16302B; --warn:#F5B547; --warn-soft:#352B16;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Figtree","Segoe UI",Roboto,Arial,sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1;letter-spacing:-.01em}
h1{font-size:34px;font-weight:900;font-stretch:75%;text-transform:uppercase}
h2{font-size:21px;font-weight:800;font-stretch:80%;text-transform:uppercase}
h3{font-size:15px;font-weight:700}
p{margin:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{display:flex;align-items:center;gap:8px;color:var(--accent)}
.brand svg{width:22px;height:22px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.teal{background:var(--teal-soft);color:var(--teal)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--raised);border-radius:12px;padding:10px 6px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
button,.btn{font-family:var(--body);font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--raised);color:var(--fg);border-radius:12px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--accent-ink)!important}
.small{padding:6px 10px;font-size:12.5px;border-radius:10px}
.energy{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.energy button{padding:8px 0;flex-direction:column;gap:0;font-size:11.5px;font-weight:600}
.energy button b{font-family:var(--display);font-size:22px;font-weight:800}
.energy button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--teal-soft);color:var(--fg)}
.note.warn{background:var(--warn-soft)}
.note.pink{background:var(--accent-soft)}
ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.checks li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
ul.checks li:first-child{border-top:0}
ul.checks input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
ul.checks label{flex:1;min-width:0;cursor:pointer}
ul.checks .sets{font-family:var(--display);font-weight:700;font-size:14px;color:var(--teal);white-space:nowrap}
ul.checks li.done label{text-decoration:line-through;color:var(--muted)}
.tip{font-size:12.5px;color:var(--muted);display:block}
.progress{height:6px;background:var(--raised);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.water{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.water button{height:40px;padding:0;border-radius:8px}
.water button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--line);border-radius:10px;padding:7px 2px;text-align:center;font-size:10.5px;font-weight:600;background:var(--raised);cursor:pointer;min-width:0;flex-direction:column;gap:0;color:var(--muted)}
.day b{display:block;font-family:var(--display);font-size:14px;font-weight:800;color:var(--fg);text-transform:uppercase}
.day.str{border-color:var(--accent-soft);background:var(--accent-soft)}
.day.act{border-color:var(--teal-soft);background:var(--teal-soft)}
.day.sel{outline:2px solid var(--accent)}
.day.today b{text-decoration:underline;text-underline-offset:3px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-top:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 120px}
.card>.field{flex:none}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input,select{font-family:var(--body);font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--fg);width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.tl .it:first-child{border-top:0}
.tl .t{font-family:var(--display);font-weight:800;font-size:15px;color:var(--teal)}
.tl .it.med .t{color:var(--accent)}
.tl .m{font-size:12.5px;color:var(--muted)}
.rem{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.rem .t{font-family:var(--display);font-weight:800;color:var(--teal)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%}
nav.tabs button{border:0;border-radius:0;background:none;padding:10px 0 12px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);flex-direction:column;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
nav.tabs button[aria-current="page"]{color:var(--accent)}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.disc{font-size:11.5px;color:var(--muted);text-align:center}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>

<script>
(function(){
/* ---------- storage ---------- */
const KEY='farashti.v2';
const todayKey=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function loadOld(){try{return JSON.parse(localStorage.getItem('hashifit.v1'))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const DEF={age:42,weight:70,height:159,medName:'Levothyroxine',dose:'',medTime:'07:00',workTime:'09:00',sunday:'U'};
let S=load();
if(!S){const o=loadOld();S={profile:Object.assign({},DEF),days:{},weights:[{d:todayKey(),w:70,waist:''}],labs:[],tab:'today'};
  if(o){['age','weight','height','dose','medTime'].forEach(k=>{if(o.profile&&o.profile[k])S.profile[k]=o.profile[k]});
    if(o.weights&&o.weights.length)S.weights=o.weights; if(o.labs)S.labs=o.labs;}}
S.profile=Object.assign({},DEF,S.profile);
function dayLog(k){k=k||todayKey();if(!S.days[k])S.days[k]={energy:0,ex:{},med:{},water:0};return S.days[k]}

/* ---------- workouts ---------- */
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WORK={
 L1:{name:'Lower — Glutes & Quads',kind:'str',ex:[
  ['Goblet or back squat','4 × 8–10','Thighs parallel to the floor, chest up'],
  ['Hip thrust (barbell)','4 × 10–12','Squeeze 2 seconds at the top'],
  ['Romanian deadlift (dumbbells)','3 × 10','Hinge from the hips, soft knees'],
  ['Walking lunges','3 × 12 / leg',''],
  ['Leg curl machine','3 × 12',''],
  ['Plank','3 × 40 s','']]},
 L2:{name:'Lower — Posterior Chain',kind:'str',ex:[
  ['Deadlift (trap bar or dumbbells)','4 × 6–8','Heaviest day of the week. Form before load'],
  ['Bulgarian split squat','3 × 10 / leg',''],
  ['Leg press (feet high & wide)','3 × 12',''],
  ['Hip abduction machine','3 × 15',''],
  ['Standing calf raise','3 × 15',''],
  ['Dead bug','3 × 10 / side','Lower back pressed to the floor']]},
 U1:{name:'Upper — Push Focus',kind:'str',ex:[
  ['Dumbbell bench press','4 × 8–10',''],
  ['Lat pulldown','3 × 10','Pull to upper chest'],
  ['Seated dumbbell shoulder press','3 × 10',''],
  ['Incline push-ups','3 × max clean reps',''],
  ['Lateral raise','3 × 15','Light weight, slow'],
  ['Triceps rope pushdown','3 × 12','']]},
 U2:{name:'Upper — Pull Focus',kind:'str',ex:[
  ['Lat pulldown or assisted pull-up','4 × 8–10',''],
  ['Seated cable row','3 × 12','Shoulders back and down'],
  ['One-arm dumbbell row','3 × 12 / arm',''],
  ['Incline dumbbell press','3 × 10',''],
  ['Face pull','3 × 15','Great for neck and posture'],
  ['Dumbbell biceps curl','3 × 12','']]},
 F:{name:'Full Body Strength',kind:'str',ex:[
  ['Goblet squat','3 × 10',''],
  ['Push-ups (incline if needed)','3 × max clean reps',''],
  ['One-arm dumbbell row','3 × 12 / arm',''],
  ['Step-ups with dumbbells','3 × 10 / leg',''],
  ['Kettlebell swing','3 × 15',''],
  ['Farmer carry','3 × 40 m','Heavy, tall posture'],
  ['Bike intervals: 30 s hard / 90 s easy','6 rounds','Only if energy is 4 or 5','finisher']]},
 W:{name:'Walk + Mobility',kind:'act',ex:[
  ['Brisk walk, zone 2 (you can talk, not sing)','40–50 min','Aim for 8,000–10,000 steps today'],
  ['Hip & spine mobility: cat-cow, 90/90, hip flexor stretch','10 min',''],
  ['Light core: bird dog + side plank','2 × 10 / 2 × 25 s','']]},
 R:{name:'Rest Day',kind:'rest',ex:[
  ['Sleep 7–8 hours. Easy stroll if you feel like it','—','With Hashimoto’s, recovery is where the muscle gets built']]}
};
function planFor(dow){ // 0 Sun … 6 Sat
  return {6:'W',0:S.profile.sunday==='F'?'F':'U2',1:'L1',2:'U1',3:'L2',4:'W',5:'R'}[dow];
}
const workoutFor=dow=>WORK[planFor(dow)];

/* ---------- nutrition ---------- */
function calc(){
  const p=S.profile,w=+p.weight||70,h=+p.height||159,a=+p.age||42;
  const bmr=Math.round(10*w+6.25*h-5*a-161), f=1.55, tdee=Math.round(bmr*f);
  const cal=Math.max(1400,Math.round(tdee*0.82/10)*10);
  const prot=Math.round(1.8*w), fat=Math.round(0.8*w), carb=Math.max(80,Math.round((cal-prot*4-fat*9)/4));
  return {bmr,f,tdee,cal,prot,fat,carb,bmi:(w/Math.pow(h/100,2)).toFixed(1)};
}
const toMin=s=>{const[a,b]=(s||'00:00').split(':').map(Number);return a*60+b};
const fmt=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function timeline(){
  const med=toMin(S.profile.medTime), wk=toMin(S.profile.workTime);
  const coffee=Math.max(med+45,wk-30), bf=wk+75;
  return {med,coffee,wk,bf,items:[
   {id:'med',t:med,n:'Thyroid medication',d:'Empty stomach, plain water only. No food or coffee yet.',med:1},
   {id:'coffee',t:coffee,n:'Coffee',d:'Black or with a splash of milk. This is your pre-workout. At least 45 min after the pill.'},
   {id:'workout',t:wk,n:'Train (fasted)',d:'Sip water during the session. Keep a date nearby if you feel dizzy.'},
   {id:'breakfast',t:bf,n:'Breakfast — post-workout',d:'2 whole eggs + 3 egg whites, 2 slices wholegrain toast, cucumber & tomato, 1 piece of fruit',k:450,pr:32},
   {id:'lunch',t:bf+240,n:'Lunch',d:'150 g grilled chicken breast (or tilapia / lean beef) + 150 g cooked rice (or potato) + big salad + 1 tbsp olive oil',k:575,pr:50},
   {id:'snack',t:bf+420,n:'Snack',d:'170 g Greek yogurt + 1 cup berries + 2 Brazil nuts (selenium)',k:215,pr:19,ca:1},
   {id:'dinner',t:bf+600,n:'Dinner',d:'200 g cottage cheese + vegetables + ½ baladi bread (or 3 tbsp ful with olive oil)',k:340,pr:31}
  ]};
}

/* ---------- reminders (calendar) ---------- */
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const ICSD=['SU','MO','TU','WE','TH','FR','SA'];
function reminders(){
  const tl=timeline(),liftDays=[0,1,2,3].map(d=>ICSD[d]).join(','),walkDays='SA,TH';
  const r=tl.items.filter(i=>i.id!=='workout').map(i=>({id:i.id,t:i.t,title:(i.id==='med'?'💊 ':i.id==='coffee'?'☕ ':'🍽 ')+i.n,desc:i.d,days:''}));
  r.splice(2,0,{id:'lift',t:tl.wk,title:'🏋️ Strength session',desc:'Open Farashti and log your energy first.',days:liftDays},
                {id:'walk',t:tl.wk,title:'🚶 Walk + mobility',desc:'40–50 min zone 2 walk.',days:walkDays});
  r.push({id:'water',t:tl.wk+240,title:'💧 Water check',desc:'Are you at 5 glasses yet?',days:''});
  r.push({id:'weigh',t:tl.med-5,title:'⚖️ Weekly weigh-in',desc:'Before the pill, after the bathroom. Log it in Farashti.',days:'FR'});
  return r.sort((a,b)=>a.t-b.t);
}
function firstDate(days){ // next date matching days (or today)
  const d=new Date(); if(!days) return d;
  for(let i=0;i<7;i++){const x=new Date();x.setDate(d.getDate()+i);if(days.split(',').includes(ICSD[x.getDay()]))return x}
  return d;
}
const stamp=(d,m)=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+fmt(m).replace(':','')+'00';
function rrule(days){return days?'RRULE:FREQ=WEEKLY;BYDAY='+days:'RRULE:FREQ=DAILY'}
function gcal(r){
  const d=firstDate(r.days),s=stamp(d,r.t),e=stamp(d,r.t+10);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(r.title)+'&details='+encodeURIComponent(r.desc)+'&dates='+s+'/'+e+'&recur='+encodeURIComponent(rrule(r.days));
}
function ics(){
  const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=reminders().map(r=>{const d=firstDate(r.days);return ['BEGIN:VEVENT','UID:farashti-'+r.id+'@farashti','DTSTAMP:'+now,'DTSTART:'+stamp(d,r.t),'DTEND:'+stamp(d,r.t+10),rrule(r.days),'SUMMARY:'+r.title,'DESCRIPTION:'+r.desc.replace(/[,;]/g,'\\$&'),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+r.title,'TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n')});
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Farashti//EN','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n');
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let selDay=new Date().getDay();
function adjust(energy,w){
  if(w.kind!=='str') return {};
  if(energy>=4) return {label:'Full',note:'Good energy. If you hit the top of the rep range on every set, add 2.5–5% next time.'};
  if(energy===3) return {label:'Steady',cls:'warn',note:'Same weights, leave 3 reps in the tank (RPE 7). Skip any finisher.'};
  if(energy===2) return {label:'Light',cls:'warn',minus:1,note:'One set less per exercise and about 20% lighter. Move without draining yourself.'};
  if(energy===1) return {label:'Recovery',cls:'',swap:true,note:'No weights today. 20–30 min walk and stretching. If this fatigue lasts over two weeks, get your TSH checked.'};
  return {note:'Rate your energy above and I’ll adjust today’s session.'};
}
const minus=(s,n)=>n?s.replace(/^(\d+)/,m=>Math.max(1,+m-n)):s;
const BF='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.4 10C9.6 5 4 4.2 4.4 8c.3 2.8 3.3 3.6 7 2.8zM12.6 10c1.8-5 7.4-5.8 7-2 -.3 2.8-3.3 3.6-7 2.8zM11.3 11.6c-3.2.5-6 2.4-4.4 4.4 1.4 1.6 3.6-.8 4.4-3.6zM12.7 11.6c3.2.5 6 2.4 4.4 4.4-1.4 1.6-3.6-.8-4.4-3.6z"/><rect x="11.4" y="7.5" width="1.2" height="9" rx=".6"/></svg>';

/* ---------- views ---------- */
function viewToday(){
  const L=dayLog(),c=calc(),dow=new Date().getDay(),tl=timeline();
  let w=workoutFor(dow); const adj=adjust(L.energy,w); if(adj.swap) w=WORK.W;
  const exs=w.ex.filter(e=>!(e[3]==='finisher'&&L.energy&&L.energy<4));
  const done=exs.filter((e,i)=>L.ex[w.name+i]).length;
  const hour=new Date().getHours(),greet=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  return `
  <header class="top"><div><div class="brand">${BF}<span class="eyebrow" style="color:inherit">Farashti</span></div><h1>${greet}</h1>
   <p class="muted">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p></div>
   <span class="pill teal num">Train ${esc(S.profile.workTime)}</span></header>

  <section class="card hero">
   <div class="row between"><div><p class="eyebrow">Today’s session</p><h2>${w.name}</h2></div>${adj.label?`<span class="pill ${adj.cls||''}">${adj.label}</span>`:''}</div>
   ${w.kind==='str'?`<div><p class="eyebrow" style="margin-bottom:6px">How’s your energy?</p>
   <div class="energy" role="group" aria-label="Energy level">
    ${[[1,'Drained'],[2,'Tired'],[3,'OK'],[4,'Good'],[5,'Strong']].map(([v,t])=>`<button data-energy="${v}" aria-pressed="${L.energy===v}"><b class="num">${v}</b>${t}</button>`).join('')}
   </div></div>`:''}
   ${adj.note?`<p class="note ${adj.cls||''}">${adj.note}</p>`:''}
   <div class="progress" aria-hidden="true"><i style="width:${exs.length?done/exs.length*100:0}%"></i></div>
   <ul class="checks">
    ${exs.map((e,i)=>{const id=w.name+i,on=!!L.ex[id];return `<li class="${on?'done':''}"><input type="checkbox" id="ex-${i}" data-ex="${esc(id)}" ${on?'checked':''}><label for="ex-${i}">${e[0]}${e[2]?`<span class="tip">${e[2]}</span>`:''}</label><span class="sets">${minus(e[1],adj.minus)}</span></li>`}).join('')}
   </ul>
   ${w.kind==='str'?'<p class="muted">8-min warm-up first. Rest 90 s between sets, 2–3 min on the big lifts.</p>':''}
  </section>

  <section class="card">
   <div class="row between"><h2>Medication</h2><span class="pill num">${esc(S.profile.medTime)}</span></div>
   <ul class="checks">
    ${[['take','Took '+esc(S.profile.medName)+(S.profile.dose?' '+esc(S.profile.dose)+' mcg':''),'Empty stomach, plain water'],
       ['wait','Waited before coffee ('+fmt(tl.coffee)+')','At least 45 minutes after the pill'],
       ['space','Calcium / iron / multivitamin 4 h later','Dairy goes in the afternoon snack']]
      .map(([k,t,tip])=>`<li class="${L.med[k]?'done':''}"><input type="checkbox" id="med-${k}" data-med="${k}" ${L.med[k]?'checked':''}><label for="med-${k}">${t}<span class="tip">${tip}</span></label></li>`).join('')}
   </ul>
  </section>

  <section class="card">
   <div class="row between"><h2>Fuel</h2><span class="muted num">${c.cal} kcal</span></div>
   <div class="stats">
    <div class="stat"><b>${c.prot}</b><span>Protein g</span></div>
    <div class="stat"><b>${c.carb}</b><span>Carbs g</span></div>
    <div class="stat"><b>${c.fat}</b><span>Fat g</span></div>
    <div class="stat"><b>${(L.water*0.25).toFixed(1)}</b><span>Water L</span></div>
   </div>
   <div class="water" role="group" aria-label="Glasses of water">
    ${Array.from({length:10},(_,i)=>`<button data-water="${i+1}" aria-pressed="${L.water>i}" aria-label="Glass ${i+1}"></button>`).join('')}
   </div>
   <p class="muted">Tap a glass for every 250 ml. Goal: 10.</p>
   <button class="primary" data-go="food">See today’s meal timeline</button>
  </section>
  ${disc()}`;
}

function viewTrain(){
  const today=new Date().getDay(),order=[6,0,1,2,3,4,5],w=workoutFor(selDay),p=S.profile;
  const short=k=>({W:'Walk',R:'Rest',L1:'Lower',L2:'Lower',U1:'Upper',U2:'Upper',F:'Full'})[k];
  return `
  <header class="top"><div><p class="eyebrow">Week starts Saturday</p><h1>Training</h1></div></header>
  <section class="card">
   <div class="week">
    ${order.map(d=>{const k=planFor(d),W=WORK[k];return `<button class="day ${W.kind} ${d===selDay?'sel':''} ${d===today?'today':''}" data-day="${d}"><b>${WD[d].slice(0,3)}</b>${short(k)}</button>`}).join('')}
   </div>
   <div class="row between"><h3>Sunday is</h3>
    <div class="seg" role="group" aria-label="Sunday session"><button data-sun="U" aria-pressed="${p.sunday!=='F'}">Upper</button><button data-sun="F" aria-pressed="${p.sunday==='F'}">Full body</button></div></div>
   <div class="row">
    <div class="field"><label for="f-wt">Training time</label><input id="f-wt" type="time" data-p="workTime" value="${esc(p.workTime)}"></div>
   </div>
  </section>
  <section class="card">
   <p class="eyebrow">${WD[selDay]}</p><h2>${w.name}</h2>
   <div class="tbl"><table><thead><tr><th>Exercise</th><th>Sets × reps</th></tr></thead><tbody>
    ${w.ex.map(e=>`<tr><td>${e[0]}${e[2]?`<span class="tip">${e[2]}</span>`:''}</td><td class="n">${e[1]}</td></tr>`).join('')}
   </tbody></table></div>
  </section>
  <section class="card">
   <h2>Progression rules</h2>
   <ul class="checks">
    <li><label>Add weight when you hit the <b>top of the rep range on every set</b> with ~2 reps left.</label></li>
    <li><label>Every 6th week: deload. Half the sets, same weights.</label></li>
    <li><label>Four years in, your body is used to training. Change now comes from <b>heavier lifts and high protein</b>, not more cardio.</label></li>
    <li><label>Fasted training is fine for you. If you feel shaky or dizzy, have a date or half a banana with the coffee.</label></li>
   </ul>
  </section>
  ${disc()}`;
}

function viewFood(){
  const c=calc(),tl=timeline(),tot=tl.items.reduce((a,m)=>a+(m.k||0),0),tp=tl.items.reduce((a,m)=>a+(m.pr||0),0);
  const calWarn=tl.bf-tl.med<240;
  return `
  <header class="top"><div><p class="eyebrow">Lose fat · build muscle</p><h1>Food</h1></div></header>
  <section class="card">
   <div class="stats">
    <div class="stat"><b>${c.cal}</b><span>kcal/day</span></div>
    <div class="stat"><b>${c.prot}</b><span>Protein</span></div>
    <div class="stat"><b>${c.carb}</b><span>Carbs</span></div>
    <div class="stat"><b>${c.fat}</b><span>Fat</span></div>
   </div>
   <details><summary>Where these numbers come from</summary>
    <div class="tbl"><table><tbody>
     <tr><td>Resting burn (Mifflin-St Jeor)</td><td class="n">${c.bmr} kcal</td></tr>
     <tr><td>× activity ${c.f}</td><td class="n">${c.tdee} kcal</td></tr>
     <tr><td>18% deficit (fat loss, keep muscle)</td><td class="n">${c.cal} kcal</td></tr>
     <tr><td>Protein 1.8 g per kg</td><td class="n">${c.prot} g</td></tr>
     <tr><td>Fat 0.8 g per kg</td><td class="n">${c.fat} g</td></tr>
     <tr><td>BMI</td><td class="n">${c.bmi}</td></tr>
    </tbody></table></div>
    <p class="muted">No change on the scale or tape after 3 weeks? Drop 100 kcal of carbs. Much more tired? Add 100.</p>
   </details>
  </section>
  <section class="card">
   <div class="row between"><h2>Your day</h2><span class="muted num">≈ ${tot} kcal · ${tp} g protein</span></div>
   <div class="tl">
   ${tl.items.map(m=>`<div class="it ${m.med?'med':''}"><span class="t num">${fmt(m.t)}</span><div><h3>${m.n}</h3><p>${m.d}</p>${m.k?`<p class="m num">${m.k} kcal · ${m.pr} g protein${m.ca?' · contains calcium, kept away from the pill':''}</p>`:''}</div></div>`).join('')}
   </div>
   ${calWarn?'<p class="note warn">Breakfast is less than 4 hours after your pill, so keep dairy out of breakfast.</p>':''}
   <p class="muted">Times follow your pill and training times. Change them in Meds and Training.</p>
  </section>
  <section class="card">
   <h2>Swaps</h2>
   <div class="tbl"><table><thead><tr><th>Instead of</th><th>You can have</th></tr></thead><tbody>
    <tr><td>150 g chicken</td><td>180 g tilapia · 130 g lean beef · 1 can tuna in water + 1 egg</td></tr>
    <tr><td>150 g cooked rice</td><td>200 g sweet or boiled potato · 1 baladi bread · 120 g cooked pasta</td></tr>
    <tr><td>Greek yogurt</td><td>1 scoop whey · 150 g cottage cheese</td></tr>
    <tr><td>Cottage cheese dinner</td><td>Medium plate of ful with olive oil + 2 boiled eggs</td></tr>
   </tbody></table></div>
  </section>
  <section class="card">
   <h2>Hashimoto’s notes</h2>
   <ul class="checks">
    <li><label><b>Brazil nuts:</b> 1–2 a day covers selenium. More can be harmful.</label></li>
    <li><label><b>Cabbage, broccoli, cauliflower:</b> fine cooked. Only very large raw amounts daily are a concern.</label></li>
    <li><label><b>Soy and high fibre:</b> not banned. Keep them away from the pill and consistent day to day.</label></li>
    <li><label><b>Gluten:</b> no need to cut it unless coeliac or sensitivity is confirmed. Ask your doctor about testing.</label></li>
    <li><label><b>Coffee:</b> always 45–60 min after the pill. Coffee too close cuts how much you absorb.</label></li>
   </ul>
  </section>
  ${disc()}`;
}

function viewMed(){
  const p=S.profile,rs=reminders(),tl=timeline();
  return `
  <header class="top"><div><p class="eyebrow">Same time every day</p><h1>Meds</h1></div></header>
  <section class="card">
   <div class="field"><label for="f-med">Medication</label><input id="f-med" data-p="medName" value="${esc(p.medName)}"></div>
   <div class="row">
    <div class="field"><label for="f-dose">Dose (mcg)</label><input id="f-dose" data-p="dose" inputmode="numeric" placeholder="e.g. 75" value="${esc(p.dose)}"></div>
    <div class="field"><label for="f-time">Pill time</label><input id="f-time" type="time" data-p="medTime" value="${esc(p.medTime)}"></div>
   </div>
   ${tl.wk-30<tl.med+45?`<p class="note warn">Your pill is close to training. Coffee moved to ${fmt(tl.coffee)} so it stays 45 min after the pill.</p>`:''}
   <p class="note pink">Only your endocrinologist sets the dose. Farashti keeps your day organised. It doesn’t change treatment.</p>
  </section>

  <section class="card" id="reminders">
   <div class="row between"><h2>Reminders</h2><span class="pill teal">${rs.length}</span></div>
   ${inFrame
    ?'<p class="note">Tap <b>Add</b> on each reminder to put it in Google Calendar. Your phone then alerts you every day at that time.</p>'
    :`<p class="note">One tap adds all reminders to your phone’s calendar with an alert on time, every day.</p>
      <button class="primary" id="icsBtn">Add all reminders to my calendar</button>
      <p class="muted">iPhone: tap <b>Add All</b> when Calendar opens. Android: open the file with Google Calendar, or use the Add buttons below.</p>`}
   <div>
    ${rs.map(r=>`<div class="rem"><span class="t num">${fmt(r.t)}</span><div><h3>${r.title}</h3><span class="muted">${r.days?r.days.split(',').map(d=>d[0]+d[1].toLowerCase()).join(' · '):'Every day'}</span></div><a class="btn small" href="${gcal(r)}" target="_blank" rel="noopener">Add</a></div>`).join('')}
   </div>
   <p class="muted">Changed your pill or training time? Delete the old reminders in your calendar and add them again.</p>
  </section>

  <section class="card">
   <h2>Pill rules</h2>
   <ul class="checks">
    <li><label>Empty stomach, glass of water, <b>45–60 min</b> before food or coffee.</label></li>
    <li><label>Calcium, iron, multivitamins, antacids: <b>4 hours later</b>.</label></li>
    <li><label>Missed it? Take it when you remember that day. Never double up without asking your doctor.</label></li>
    <li><label>Blood test day: test in the morning before the pill. Stop biotin (hair supplements) 2 days before, it skews results.</label></li>
   </ul>
  </section>

  <section class="card">
   <h2>Lab results</h2>
   <div class="row">
    <div class="field"><label for="l-d">Date</label><input id="l-d" type="date" value="${todayKey()}"></div>
    <div class="field"><label for="l-tsh">TSH (mIU/L)</label><input id="l-tsh" inputmode="decimal" placeholder="2.1"></div>
    <div class="field"><label for="l-t4">Free T4</label><input id="l-t4" inputmode="decimal" placeholder="optional"></div>
   </div>
   <button class="primary" id="addLab">Save result</button>
   ${S.labs.length?`<div class="tbl"><table><thead><tr><th>Date</th><th>TSH</th><th>Free T4</th><th></th></tr></thead><tbody>
    ${S.labs.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(l=>`<tr><td class="n">${l.d}</td><td class="n">${esc(l.tsh)}</td><td class="n">${esc(l.t4||'—')}</td><td><button class="small" data-dellab="${l.id}" aria-label="Delete">✕</button></td></tr>`).join('')}
   </tbody></table></div>`:'<p class="muted">No results yet. Add your latest TSH to start tracking.</p>'}
   <p class="muted">TSH is usually rechecked 6–8 weeks after a dose change, then every 6–12 months once stable. Your doctor sets the target.</p>
  </section>
  <section class="card">
   <h2>Ask your doctor about</h2>
   <p>Vitamin D · Ferritin · B12 · Anti-TPO · Fasting glucose. Low levels of any of these cause fatigue and stall fat loss even when TSH looks fine.</p>
  </section>
  ${disc()}`;
}

function viewProgress(){
  const ws=S.weights.slice().sort((a,b)=>a.d.localeCompare(b.d)),last=ws[ws.length-1],first=ws[0];
  const diff=last&&first?(last.w-first.w).toFixed(1):0;
  let sessions=0;for(let i=0;i<28;i++){const d=new Date();d.setDate(d.getDate()-i);const L=S.days[todayKey(d)];if(L&&Object.values(L.ex).some(Boolean))sessions++}
  const p=S.profile;
  return `
  <header class="top"><div><p class="eyebrow">Tape and strength beat the scale</p><h1>Progress</h1></div></header>
  <section class="card">
   <div class="stats">
    <div class="stat"><b>${last?last.w:'—'}</b><span>kg now</span></div>
    <div class="stat"><b>${diff>0?'+':''}${diff}</b><span>since start</span></div>
    <div class="stat"><b>${last&&last.waist?last.waist:'—'}</b><span>waist cm</span></div>
    <div class="stat"><b>${sessions}</b><span>active / 28d</span></div>
   </div>
   ${chart(ws)}
  </section>
  <section class="card">
   <h2>Log weight</h2>
   <div class="row">
    <div class="field"><label for="w-d">Date</label><input id="w-d" type="date" value="${todayKey()}"></div>
    <div class="field"><label for="w-w">Weight kg</label><input id="w-w" inputmode="decimal" placeholder="70"></div>
    <div class="field"><label for="w-s">Waist cm</label><input id="w-s" inputmode="decimal" placeholder="optional"></div>
   </div>
   <button class="primary" id="addW">Save</button>
   <p class="muted">Weigh once a week, same day, in the morning before the pill. Weight jumps around your period.</p>
  </section>
  <section class="card">
   <h2>Your details</h2>
   <div class="row">
    <div class="field"><label for="p-a">Age</label><input id="p-a" data-p="age" inputmode="numeric" value="${p.age}"></div>
    <div class="field"><label for="p-w">Weight kg</label><input id="p-w" data-p="weight" inputmode="decimal" value="${p.weight}"></div>
    <div class="field"><label for="p-h">Height cm</label><input id="p-h" data-p="height" inputmode="numeric" value="${p.height}"></div>
   </div>
   <p class="muted">Calories and protein update when you change these.</p>
  </section>
  ${disc()}`;
}

function chart(ws){
  if(ws.length<2) return '<p class="muted">Log at least two weigh-ins to see your trend.</p>';
  const W=320,H=120,pad=26,vals=ws.map(x=>+x.w),mn=Math.min(...vals)-0.5,mx=Math.max(...vals)+0.5;
  const X=i=>pad+(W-pad*2)*i/(ws.length-1),Y=v=>12+(H-34)*(1-(v-mn)/(mx-mn));
  const pts=ws.map((x,i)=>X(i)+','+Y(+x.w)).join(' '),lx=X(ws.length-1),ly=Y(vals[vals.length-1]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight trend">
   <line x1="${pad}" x2="${W-pad}" y1="${Y(mx-0.5)}" y2="${Y(mx-0.5)}" stroke="var(--line)"/>
   <line x1="${pad}" x2="${W-pad}" y1="${Y(mn+0.5)}" y2="${Y(mn+0.5)}" stroke="var(--line)"/>
   <text x="2" y="${Y(mx-0.5)+3}">${(mx-0.5).toFixed(1)}</text><text x="2" y="${Y(mn+0.5)+3}">${(mn+0.5).toFixed(1)}</text>
   <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${lx}" cy="${ly}" r="4.5" fill="var(--accent)"/>
   <text x="${X(0)}" y="${H-4}" text-anchor="middle">${ws[0].d.slice(5)}</text><text x="${lx}" y="${H-4}" text-anchor="middle">${ws[ws.length-1].d.slice(5)}</text>
  </svg>`;
}
function disc(){return '<p class="disc">Farashti is for planning and motivation, not medical advice. Dose or supplement changes go through your doctor.</p>'}

/* ---------- tabs ---------- */
const TABS=[
 ['today','Today','<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',viewToday],
 ['train','Train','<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',viewTrain],
 ['food','Food','<path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M12 7c0-2 2-2 2-4"/>',viewFood],
 ['med','Meds','<path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="12" r="8.5"/>',viewMed],
 ['progress','Progress','<path d="M4 19h16M6 15l4-4 3 3 5-6"/>',viewProgress]
];
function render(){
  const t=TABS.find(x=>x[0]===S.tab)||TABS[0];
  $('#app').innerHTML=t[3]();
  $('#tabs').innerHTML=TABS.map(x=>`<button data-tab="${x[0]}" ${x[0]===t[0]?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${x[2]}</svg>${x[1]}</button>`).join('');
}
function go(tab){S.tab=tab;save();render();window.scrollTo(0,0)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset,L=dayLog();
  if(d.tab) return go(d.tab);
  if(d.go) return go(d.go);
  if(d.energy){L.energy=+d.energy;save();return render()}
  if(d.water){const n=+d.water;L.water=L.water===n?n-1:n;save();return render()}
  if(d.sun){S.profile.sunday=d.sun;save();return render()}
  if(d.day){selDay=+d.day;return render()}
  if(d.dellab){S.labs=S.labs.filter(l=>String(l.id)!==d.dellab);save();return render()}
  if(b.id==='icsBtn'){location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics());return}
  if(b.id==='addLab'){const tsh=$('#l-tsh').value.trim();if(!tsh){$('#l-tsh').focus();return}
    S.labs.push({id:Date.now(),d:$('#l-d').value||todayKey(),tsh,t4:$('#l-t4').value.trim()});save();return render()}
  if(b.id==='addW'){const w=parseFloat($('#w-w').value);if(!w){$('#w-w').focus();return}
    const dd=$('#w-d').value||todayKey();S.weights=S.weights.filter(x=>x.d!==dd);
    S.weights.push({d:dd,w,waist:$('#w-s').value.trim()});
    if(dd>=S.weights.map(x=>x.d).sort().slice(-1)[0])S.profile.weight=w;save();return render()}
});
document.addEventListener('change',e=>{
  const el=e.target,L=dayLog();
  if(el.dataset.med){L.med[el.dataset.med]=el.checked;save();return render()}
  if(el.dataset.ex){L.ex[el.dataset.ex]=el.checked;save();return render()}
  if(el.dataset.p){S.profile[el.dataset.p]=el.value;save();if(el.type==='time')render()}
});
render();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
