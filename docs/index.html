<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6F62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فراشتي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>فراشتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, sticky tab bar at the bottom like a native app; "today" view first. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --fg:#18231F; --muted:#5C6B65; --line:#D6DFDB;
  --accent:#1F6F62; --accent-soft:#DCEDE8; --berry:#A53D62; --berry-soft:#F6E2EA;
  --good:#2E7D4F; --warn:#B26A00; --warn-soft:#FBEBD2; --bad:#B3261E;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#18221F; --fg:#E6EEEB; --muted:#93A39D; --line:#2A3833;
  --accent:#5FC2AE; --accent-soft:#1D3530; --berry:#E58AAB; --berry-soft:#3A2230;
  --good:#6FCF97; --warn:#F2B455; --warn-soft:#3A2E17; --bad:#F28B82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --fg:#E6EEEB; --muted:#93A39D; --line:#2A3833;
  --accent:#5FC2AE; --accent-soft:#1D3530; --berry:#E58AAB; --berry-soft:#3A2230;
  --good:#6FCF97; --warn:#F2B455; --warn-soft:#3A2E17; --bad:#F28B82; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7;direction:rtl;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.berry{background:var(--berry-soft);color:var(--berry)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
button,.btn{font-family:var(--body);font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.energy{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.energy button{padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px}
.energy button b{font-family:var(--display);font-size:18px}
.energy button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.note{border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--accent-soft)}
.note.warn{background:var(--warn-soft)}
.note.berry{background:var(--berry-soft)}
ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.checks li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
ul.checks li:first-child{border-top:0}
ul.checks input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:3px}
ul.checks label{flex:1;min-width:0;cursor:pointer}
ul.checks .sets{font-family:var(--display);font-size:13px;color:var(--accent);white-space:nowrap}
ul.checks li.done label{text-decoration:line-through;color:var(--muted)}
.tip{font-size:12.5px;color:var(--muted);display:block}
.progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:36px;height:42px;padding:0;font-size:18px;line-height:1}
.water button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;background:var(--surface);cursor:pointer;min-width:0}
.day b{display:block;font-family:var(--display);font-size:13px}
.day.str{background:var(--accent-soft);border-color:transparent}
.day.act{background:var(--berry-soft);border-color:transparent}
.day.sel{outline:2px solid var(--accent)}
.day.today b{text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;border-top:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 120px}
.field label{font-size:12.5px;color:var(--muted)}
input,select{font-family:var(--body);font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.meal{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal .t{font-family:var(--display);font-size:13px;color:var(--accent)}
.meal .m{font-size:12.5px;color:var(--muted)}
.meal.med .t{color:var(--berry)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%}
nav.tabs button{border:0;border-radius:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent)}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.disc{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<nav class="tabs" aria-label="الأقسام"><div class="in" id="tabs"></div></nav>

<script>
(function(){
/* ---------- storage ---------- */
const KEY='hashifit.v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const todayKey=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const S=load()||{
  profile:{age:42,weight:70,height:159,mode:'4',medName:'ليفوثيروكسين (يوثيروكس / إلتروكسين)',dose:'',medTime:'06:30'},
  days:{}, weights:[{d:todayKey(),w:70,waist:''}], labs:[], tab:'today'
};
function dayLog(k){k=k||todayKey();if(!S.days[k])S.days[k]={energy:0,ex:{},med:{},water:0};return S.days[k]}

/* ---------- plan data ---------- */
const WD=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];
const WORK={
 A:{name:'سفلي — أرداف وفخذ أمامي',kind:'str',ex:[
  ['سكوات بالدمبل (جوبلت) أو بالبار','4 × 8–10','انزلي لحد ما الفخذ يبقى موازي للأرض، ضهرك مفرود'],
  ['رومانيان ديدلفت بالدمبل','3 × 10','الحركة من الوسط، الركبة مثنية سنة صغيرة'],
  ['هيب ثرست بالبار','4 × 10–12','اضغطي الأرداف فوق ثانيتين'],
  ['لانجز مشي بالدمبل','3 × 12 لكل رجل',''],
  ['ليج كيرل على الجهاز','3 × 12',''],
  ['بلانك','3 × 40 ثانية','']]},
 B:{name:'علوي — دفع وسحب',kind:'str',ex:[
  ['لات بول داون','4 × 10','اسحبي لحد أعلى الصدر'],
  ['ضغط صدر بالدمبل على بنش','3 × 10',''],
  ['سحب كابل جالس','3 × 12','الكتف لورا وتحت'],
  ['ضغط كتف بالدمبل جالسة','3 × 10',''],
  ['رفرفة جانبي','3 × 15','وزن خفيف وتحكم'],
  ['فيس بول بالكابل','3 × 15','مهم لوضع الكتف والرقبة']]},
 C:{name:'سفلي — خلفي وأرداف',kind:'str',ex:[
  ['ديدلفت (تراب بار أو دمبل)','4 × 6–8','أتقل يوم في الأسبوع، الفورم قبل الوزن'],
  ['بلغاري سبليت سكوات','3 × 10 لكل رجل',''],
  ['ليج بريس (رجل فوق وعريضة)','3 × 12',''],
  ['هيب أبدكشن على الجهاز','3 × 15',''],
  ['سمانة واقف','3 × 15',''],
  ['ديد بَج','3 × 10 لكل جنب','ضهرك لازق في الأرض']]},
 D:{name:'جسم كامل + قوة وظيفية',kind:'str',ex:[
  ['ضغط (على بنش لو محتاجة)','3 × أقصى عدد بفورم سليم',''],
  ['تجديف دمبل بإيد واحدة','3 × 12 لكل إيد',''],
  ['ستيب أب على بوكس بالدمبل','3 × 10 لكل رجل',''],
  ['كتل بل سوينج','3 × 15',''],
  ['فارمر كاري','3 × 40 متر','امشي بوزن تقيل وضهرك مفرود'],
  ['إنترفال عجلة: 30 ث سريع / 90 ث هادي','6 جولات','بس لو طاقتك 4 أو 5','finisher']]},
 W:{name:'مشي Zone 2 + موبيليتي',kind:'act',ex:[
  ['مشي سريع (تقدري تتكلمي بس مش تغني)','35–45 دقيقة','حوالي 8000–10000 خطوة في اليوم'],
  ['موبيليتي للحوض والضهر (Cat-Cow، 90/90، Hip flexor)','10 دقايق',''],
  ['كور خفيف: بيرد دوج + سايد بلانك','2 × 10 / 2 × 25 ث','']]},
 R:{name:'راحة كاملة',kind:'rest',ex:[
  ['نوم 7–8 ساعات وتمشية خفيفة لو حابة','—','الراحة جزء من الخطة مع الهاشيموتو، العضلة بتتبني وانتي مرتاحة']]}
};
// getDay(): 0 Sun … 6 Sat. Egyptian week starts Saturday.
const SCHED={'4':{6:'A',0:'B',1:'W',2:'C',3:'D',4:'W',5:'R'},
             '6':{6:'A',0:'B',1:'W',2:'C',3:'D',4:'W',5:'R'}};
const OPTIONAL_ACTIVE=m=>m==='4'; // in 4-day mode walking days are optional

/* ---------- nutrition ---------- */
function calc(){
  const p=S.profile,w=+p.weight||70,h=+p.height||159,a=+p.age||42;
  const bmr=Math.round(10*w+6.25*h-5*a-161);
  const f=p.mode==='6'?1.6:1.5;
  const tdee=Math.round(bmr*f);
  let cal=Math.max(1400,Math.round(tdee*0.82/10)*10);
  const prot=Math.round(1.8*w), fat=Math.round(0.8*w);
  const carb=Math.max(80,Math.round((cal-prot*4-fat*9)/4));
  const bmi=(w/Math.pow(h/100,2)).toFixed(1);
  return {bmr,f,tdee,cal,prot,fat,carb,bmi};
}
function meals(){
  const p=S.profile,[hh,mm]=(p.medTime||'06:30').split(':').map(Number);
  const t=(add)=>{const x=hh*60+mm+add;const H=Math.floor(((x%1440)+1440)%1440/60),M=((x%60)+60)%60;return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')};
  return [
   {t:t(0),med:1,n:'الدوا على معدة فاضية',d:'كوباية مية بس. لا قهوة ولا شاي ولا أكل.'},
   {t:t(60),n:'فطار',d:'2 بيضة كاملة + 2 بياض + شريحة توست أسمر + خيار وطماطم + نص معلقة زيت زيتون',k:300,pr:24},
   {t:t(75),n:'القهوة',d:'بعد الفطار، مش قبل الدوا بساعة على الأقل.'},
   {t:t(270),n:'سناك',d:'زبادي يوناني لايت 170 جم + كوب فراولة أو توت + 2 حبة بندق برازيلي (سيلينيوم)',k:215,pr:19,c:1},
   {t:t(480),n:'غدا',d:'150 جم صدور فراخ مشوية (أو سمك بلطي / لحمة قليلة الدهن) + 150 جم رز مطبوخ (أو بطاطا) + سلطة كبيرة + معلقة زيت زيتون',k:575,pr:50},
   {t:t(630),n:'قبل التمرين',d:'موزة صغيرة + معلقة زبدة فول سوداني',k:185,pr:5},
   {t:t(780),n:'عشا',d:'200 جم جبنة قريش + خضار + نص رغيف بلدي (أو 3 معالق فول بزيت زيتون)',k:340,pr:31}
  ];
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=d=>d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
let selDay=new Date().getDay();

function workoutFor(dow){return WORK[SCHED[S.profile.mode][dow]]}
function adjust(energy,w){
  if(w.kind!=='str') return {label:'',note:''};
  if(energy>=4) return {label:'كامل',cls:'',note:'طاقتك حلوة. لو كملتي أعلى عدد عدات في كل الجولات بسهولة، زودي الوزن 2.5–5٪ المرة الجاية.'};
  if(energy===3) return {label:'متوسط',cls:'warn',note:'اشتغلي على نفس الأوزان، وسيبي 3 عدات في الخزان (RPE 7). شيلي الإنترفال لو موجود.'};
  if(energy===2) return {label:'خفيف',cls:'warn',minus:1,note:'نقصي جولة من كل تمرين ونزلي الوزن حوالي 20٪. الهدف إنك تتحركي من غير ما تستنزفي.'};
  if(energy===1) return {label:'استشفاء',cls:'berry',swap:true,note:'النهارده بلاش حديد. اعملي مشي 20–30 دقيقة واستطالات. لو التعب ده مستمر أكتر من أسبوعين، اعملي تحليل TSH وكلمي دكتورك.'};
  return {label:'',note:'سجّلي طاقتك فوق عشان أظبطلك تمرين النهارده.'};
}
function setsMinus(s,n){return n?s.replace(/^(\d+)/,m=>Math.max(1,+m-n)):s}

/* ---------- views ---------- */
function viewToday(){
  const L=dayLog(),c=calc(),dow=new Date().getDay();
  let w=workoutFor(dow); const adj=adjust(L.energy,w);
  if(adj.swap) w=WORK.W;
  const exs=w.ex.filter(e=>!(e[3]==='finisher'&&L.energy&&L.energy<4));
  const done=exs.filter((e,i)=>L.ex[w.name+i]).length;
  const optional=w.kind==='act'&&OPTIONAL_ACTIVE(S.profile.mode)&&!adj.swap;
  return `
  <header class="top"><div><p class="date">فراشتي · ${fmtDate(new Date())}</p><h1>صباح الفل 🦋</h1></div>
  <span class="pill">${S.profile.mode==='4'?'4 أيام حديد':'6 أيام نشاط'}</span></header>

  <section class="card">
   <div class="row between"><h2>الدوا</h2><span class="pill berry num">${esc(S.profile.medTime)}</span></div>
   <ul class="checks">
    ${[['take','أخدت '+esc(S.profile.medName)+(S.profile.dose?' — '+esc(S.profile.dose)+' مكجم':''),'معدة فاضية + كوباية مية'],
       ['wait','استنيت 30–60 دقيقة قبل الفطار والقهوة',''],
       ['space','الكالسيوم / الحديد / الملتي فيتامين بعد الدوا بـ 4 ساعات','الزبادي والجبنة في السناك مش في الفطار']]
      .map(([k,t,tip])=>`<li class="${L.med[k]?'done':''}"><input type="checkbox" id="med-${k}" data-med="${k}" ${L.med[k]?'checked':''}><label for="med-${k}">${t}${tip?`<span class="tip">${tip}</span>`:''}</label></li>`).join('')}
   </ul>
  </section>

  <section class="card">
   <h2>طاقتك النهارده؟</h2>
   <div class="energy" role="group" aria-label="مستوى الطاقة">
    ${[[1,'منهارة'],[2,'تعبانة'],[3,'عادي'],[4,'كويسة'],[5,'نار']].map(([v,t])=>`<button data-energy="${v}" aria-pressed="${L.energy===v}"><b class="num">${v}</b>${t}</button>`).join('')}
   </div>
   <p class="muted">مع الهاشيموتو الطاقة بتتغير من يوم ليوم. التطبيق بيخفف أو يزود التمرين على حسب إجابتك.</p>
  </section>

  <section class="card">
   <div class="row between"><div><p class="muted">تمرين النهارده</p><h2>${w.name}</h2></div>
    ${adj.label?`<span class="pill ${adj.cls||''}">${adj.label}</span>`:''}</div>
   ${optional?'<p class="note">يوم اختياري في خطة الـ 4 أيام: لو عندك طاقة امشي، لو لأ ارتاحي.</p>':''}
   ${adj.note?`<p class="note ${adj.cls||''}">${adj.note}</p>`:''}
   <div class="progress" aria-hidden="true"><i style="width:${exs.length?done/exs.length*100:0}%"></i></div>
   <ul class="checks">
    ${exs.map((e,i)=>{const id=w.name+i,on=!!L.ex[id];return `<li class="${on?'done':''}"><input type="checkbox" id="ex-${i}" data-ex="${esc(id)}" ${on?'checked':''}><label for="ex-${i}">${e[0]}${e[2]?`<span class="tip">${e[2]}</span>`:''}</label><span class="sets">${setsMinus(e[1],adj.minus)}</span></li>`}).join('')}
   </ul>
   ${w.kind==='str'?'<p class="muted">إحماء 8 دقايق قبل البدء. راحة 90 ثانية بين الجولات و2–3 دقايق في الحركات الكبيرة.</p>':''}
  </section>

  <section class="card">
   <div class="row between"><h2>أكلك النهارده</h2><span class="muted num">${c.cal} سعر</span></div>
   <div class="stats">
    <div class="stat"><b>${c.prot}</b><span>بروتين جم</span></div>
    <div class="stat"><b>${c.carb}</b><span>كارب جم</span></div>
    <div class="stat"><b>${c.fat}</b><span>دهون جم</span></div>
    <div class="stat"><b>${(L.water*0.25).toFixed(2).replace(/0$/,'')}</b><span>لتر مية</span></div>
   </div>
   <p class="muted">المية: كل كوباية 250 مل، الهدف 10 كوبايات.</p>
   <div class="water" role="group" aria-label="أكواب المية">
    ${Array.from({length:10},(_,i)=>`<button data-water="${i+1}" aria-pressed="${L.water>i}" aria-label="كوباية ${i+1}">${L.water>i?'💧':'○'}</button>`).join('')}
   </div>
   <button class="primary" data-go="food">شوفي جدول الأكل</button>
  </section>
  ${disc()}`;
}

function viewTrain(){
  const m=S.profile.mode,today=new Date().getDay();
  const order=[6,0,1,2,3,4,5];
  const w=workoutFor(selDay);
  return `
  <header class="top"><div><h1>التمارين</h1><p class="muted">تقسيمة علوي / سفلي، الأسبوع بيبدأ السبت</p></div></header>
  <section class="card">
   <div class="row between"><h3>عدد الأيام</h3>
    <div class="seg" role="group" aria-label="عدد أيام التمرين">
     <button data-mode="4" aria-pressed="${m==='4'}">4 أيام</button>
     <button data-mode="6" aria-pressed="${m==='6'}">يومي (6)</button></div></div>
   <p class="muted">${m==='4'?'4 أيام حديد، ويومين مشي اختياري، والجمعة راحة.':'4 أيام حديد + يومين مشي وكور أساسيين + الجمعة راحة. الحديد مش هيزيد عن 4 أيام عشان الغدة والاستشفاء.'}</p>
   <div class="week">
    ${order.map(d=>{const k=SCHED[m][d],W=WORK[k];return `<button class="day ${W.kind} ${d===selDay?'sel':''} ${d===today?'today':''}" data-day="${d}"><b>${WD[d].replace('ال','')}</b>${W.kind==='str'?k:W.kind==='act'?'مشي':'راحة'}</button>`}).join('')}
   </div>
  </section>
  <section class="card">
   <div class="row between"><h2>${WD[selDay]}: ${w.name}</h2></div>
   <div class="tbl"><table><thead><tr><th>التمرين</th><th>الجولات × العدات</th></tr></thead><tbody>
    ${w.ex.map(e=>`<tr><td>${e[0]}${e[2]?`<span class="tip">${e[2]}</span>`:''}</td><td class="n">${e[1]}</td></tr>`).join('')}
   </tbody></table></div>
  </section>
  <section class="card">
   <h2>قواعد التقدم</h2>
   <ul class="checks">
    <li><label>زودي الوزن لما تكملي <b>أعلى عدد عدات في كل الجولات</b> وتحسي إن فاضل 2 عدة.</label></li>
    <li><label>كل 6 أسابيع: أسبوع خفيف (نص الجولات، نفس الأوزان) عشان الجسم يستشفي.</label></li>
    <li><label>4 سنين تمرين يعني جسمك متعود. التغيير الحقيقي هيجي من <b>الأوزان التقيلة والبروتين العالي</b>، مش من كارديو زيادة.</label></li>
    <li><label>كارديو عنيف كتير بيرفع الكورتيزول ويتعب الغدة. المشي هو صاحبك.</label></li>
   </ul>
  </section>
  ${disc()}`;
}

function viewFood(){

  <section class="card">
   <div class="stats">
    <div class="stat"><b>${c.cal}</b><span>سعر/يوم</span></div>
    <div class="stat"><b>${c.prot}</b><span>بروتين</span></div>
    <div class="stat"><b>${c.carb}</b><span>كارب</span></div>

   </div>

     <tr><td>بروتين 1.8 جم لكل كيلو</td><td class="n">${c.prot} جم</td></tr>

    <p class="muted">لو الوزن ما نزلش خالص بعد 3 أسابيع، نقصي 100 سعر من الكارب. لو التعب زاد جامد، زودي 100.</p>

  </section>
  <section class="card">
   <div class="row between"><h2>يومك بالساعة</h2><span class="muted num">≈ ${tot} سعر · ${tp} جم بروتين</span></div>

  </section>
  <section class="card">
   <h2>بدايل</h2>
   <div class="tbl"><table><thead><tr><th>بدل</th><th>ممكن</th></tr></thead><tbody>
    <tr><td>150 جم فراخ</td><td>180 جم سمك بلطي/بوري · 130 جم لحمة حمرا قليلة الدهن · علبة تونة مية + بيضة</td></tr>
    <tr><td>150 جم رز مطبوخ</td><td>200 جم بطاطا/بطاطس مسلوقة · رغيف بلدي · 120 جم مكرونة مطبوخة</td></tr>
    <tr><td>زبادي يوناني</td><td>سكوب واي بروتين · 150 جم جبنة قريش</td></tr>
    <tr><td>جبنة قريش عشا</td><td>طبق فول متوسط بزيت زيتون + بيضتين مسلوق</td></tr>
   </tbody></table></div>
  </section>
  <section class="card">
   <h2>مع الهاشيموتو</h2>
   <ul class="checks">
    <li><label><b>البندق البرازيلي:</b> حباية أو اتنين في اليوم كفاية للسيلينيوم. أكتر من كده ممكن يضر.</label></li>
    <li><label><b>الكرنب والبروكلي والقرنبيط:</b> مطبوخين عادي جدًا. المشكلة بس في كميات نية كبيرة كل يوم.</label></li>
    <li><label><b>الصويا والألياف العالية:</b> مش ممنوعين، بس خليهم بعيد عن ميعاد الدوا وثابتين في كمياتهم.</label></li>
    <li><label><b>الجلوتين:</b> مش لازم تشيليه إلا لو عندك حساسية أو سيلياك مثبتة. ممكن تسألي دكتورك عن تحليل.</label></li>
    <li><label><b>السكر والأكل المصنّع:</b> قللي منهم عشان الالتهاب ومستوى الطاقة.</label></li>
   </ul>
  </section>
  ${disc()}`;
}

function viewMed(){
  const p=S.profile;
  return `
  <header class="top"><div><h1>العلاج</h1><p class="muted">ميعاد ثابت كل يوم = مستوى هرمون ثابت</p></div></header>
  <section class="card">
   <div class="row">
    <div class="field"><label for="f-med">اسم الدوا</label><input id="f-med" data-p="medName" value="${esc(p.medName)}"></div>
   </div>
   <div class="row">
    <div class="field"><label for="f-dose">الجرعة (مكجم)</label><input id="f-dose" data-p="dose" inputmode="numeric" placeholder="مثلًا 75" value="${esc(p.dose)}"></div>
    <div class="field"><label for="f-time">ميعاد الدوا</label><input id="f-time" data-p="medTime" type="time" value="${esc(p.medTime)}"></div>
   </div>
   <p class="note berry">الجرعة بيحددها دكتورك من التحاليل بس. التطبيق ده بيفكرك وبيرتب يومك، مش بيغير العلاج.</p>
  </section>
  <section class="card">
   <h2>قواعد الدوا</h2>
   <ul class="checks">
    <li><label>على معدة فاضية بكوباية مية، و<b>30–60 دقيقة</b> قبل أي أكل أو قهوة.</label></li>
    <li><label>الكالسيوم والحديد والملتي فيتامين ومضادات الحموضة: <b>بعده بـ 4 ساعات</b>.</label></li>
    <li><label>لو نسيتي الجرعة، خديها أول ما تفتكري في نفس اليوم. ما تاخديش جرعتين مع بعض من غير ما تسألي دكتورك.</label></li>
    <li><label>قبل التحليل: اعملي التحليل الصبح قبل الجرعة، ووقفي البيوتين (في مكملات الشعر) قبلها بيومين لأنه بيلخبط النتيجة.</label></li>
   </ul>
  </section>
  <section class="card">
   <h2>سجل التحاليل</h2>
   <div class="row">
    <div class="field"><label for="l-d">التاريخ</label><input id="l-d" type="date" value="${todayKey()}"></div>
    <div class="field"><label for="l-tsh">TSH (mIU/L)</label><input id="l-tsh" inputmode="decimal" placeholder="2.1"></div>
    <div class="field"><label for="l-t4">Free T4</label><input id="l-t4" inputmode="decimal" placeholder="اختياري"></div>
   </div>
   <button class="primary" id="addLab">احفظي التحليل</button>
   ${S.labs.length?`<div class="tbl"><table><thead><tr><th>التاريخ</th><th>TSH</th><th>Free T4</th><th></th></tr></thead><tbody>
    ${S.labs.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(l=>`<tr><td class="n">${l.d}</td><td class="n">${esc(l.tsh)}</td><td class="n">${esc(l.t4||'—')}</td><td><button data-dellab="${l.id}" aria-label="امسحي">✕</button></td></tr>`).join('')}
   </tbody></table></div>`:'<p class="muted">لسه مفيش تحاليل. سجلي آخر TSH عشان تتابعي.</p>'}
   <p class="muted">المعتاد إن الـ TSH يتعاد كل 6–8 أسابيع بعد أي تغيير في الجرعة، وكل 6–12 شهر لما يستقر. الرقم المستهدف بيحدده دكتورك.</p>
  </section>
  <section class="card">
   <h2>تحاليل تسألي عنها دكتورك</h2>
   <p>فيتامين د · فيريتين (مخزون الحديد) · B12 · Anti-TPO · سكر صايم. نقص أي واحد منهم بيعمل تعب وصعوبة في نزول الوزن حتى لو الـ TSH مظبوط.</p>
  </section>
  ${disc()}`;
}

function viewProgress(){
  const ws=S.weights.slice().sort((a,b)=>a.d.localeCompare(b.d));
  const last=ws[ws.length-1],first=ws[0];
  const diff=last&&first?(last.w-first.w).toFixed(1):0;
  // workouts completed last 28 days
  let sessions=0;for(let i=0;i<28;i++){const d=new Date();d.setDate(d.getDate()-i);const L=S.days[todayKey(d)];if(L&&Object.values(L.ex).some(Boolean))sessions++}
  const p=S.profile;
  return `
  <header class="top"><div><h1>التقدم</h1><p class="muted">الميزان مش كل حاجة. المقاس والقوة أهم</p></div></header>
  <section class="card">
   <div class="stats">
    <div class="stat"><b>${last?last.w:'—'}</b><span>كجم دلوقتي</span></div>
    <div class="stat"><b dir="ltr">${diff>0?'+':''}${diff}</b><span>من البداية</span></div>
    <div class="stat"><b>${last&&last.waist?last.waist:'—'}</b><span>الوسط سم</span></div>
    <div class="stat"><b>${sessions}</b><span>يوم تمرين / 28</span></div>
   </div>
   ${chart(ws)}
  </section>
  <section class="card">
   <h2>سجلي وزن جديد</h2>
   <div class="row">
    <div class="field"><label for="w-d">التاريخ</label><input id="w-d" type="date" value="${todayKey()}"></div>
    <div class="field"><label for="w-w">الوزن كجم</label><input id="w-w" inputmode="decimal" placeholder="70"></div>
    <div class="field"><label for="w-s">الوسط سم</label><input id="w-s" inputmode="decimal" placeholder="اختياري"></div>
   </div>
   <button class="primary" id="addW">احفظي</button>
   <p class="muted">اوزني نفسك مرة في الأسبوع، نفس اليوم، الصبح بعد الحمام وقبل الأكل. الوزن بيتلخبط أيام الدورة.</p>
  </section>
  <section class="card">
   <h2>بياناتك</h2>
   <div class="row">
    <div class="field"><label for="p-a">السن</label><input id="p-a" data-p="age" inputmode="numeric" value="${p.age}"></div>
    <div class="field"><label for="p-w">الوزن</label><input id="p-w" data-p="weight" inputmode="decimal" value="${p.weight}"></div>
    <div class="field"><label for="p-h">الطول سم</label><input id="p-h" data-p="height" inputmode="numeric" value="${p.height}"></div>
   </div>
   <p class="muted">لما تغيري الوزن هنا، السعرات والبروتين بيتحسبوا من جديد.</p>
  </section>
  ${disc()}`;
}

function chart(ws){
  if(ws.length<2) return '<p class="muted">سجلي وزنين على الأقل عشان يظهر الرسم.</p>';
  const W=320,H=120,pad=26,vals=ws.map(x=>+x.w),mn=Math.min(...vals)-0.5,mx=Math.max(...vals)+0.5;
  const X=i=>pad+(W-pad*2)*(ws.length===1?0:i/(ws.length-1)), Y=v=>12+(H-34)*(1-(v-mn)/(mx-mn));
  const pts=ws.map((x,i)=>X(i)+','+Y(+x.w)).join(' ');
  const lx=X(ws.length-1),ly=Y(vals[vals.length-1]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="رسم الوزن">
   <line x1="${pad}" x2="${W-pad}" y1="${Y(mx-0.5)}" y2="${Y(mx-0.5)}" stroke="var(--line)"/>
   <line x1="${pad}" x2="${W-pad}" y1="${Y(mn+0.5)}" y2="${Y(mn+0.5)}" stroke="var(--line)"/>
   <text x="${W-2}" y="${Y(mx-0.5)+3}" text-anchor="end">${(mx-0.5).toFixed(1)}</text>
   <text x="${W-2}" y="${Y(mn+0.5)+3}" text-anchor="end">${(mn+0.5).toFixed(1)}</text>
   <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${lx}" cy="${ly}" r="4.5" fill="var(--accent)"/>
   <text x="${X(0)}" y="${H-4}" text-anchor="middle">${ws[0].d.slice(5)}</text>
   <text x="${lx}" y="${H-4}" text-anchor="middle">${ws[ws.length-1].d.slice(5)}</text>
  </svg>`;
}

function disc(){return '<p class="disc">التطبيق ده للتنظيم والتحفيز ومش بديل عن دكتور الغدد. أي تغيير في الجرعة أو المكملات لازم يكون بإشرافه.</p>'}

/* ---------- tabs ---------- */
const TABS=[
 ['today','النهارده','<path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/>',viewToday],
 ['train','التمارين','<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',viewTrain],
 ['food','الأكل','<path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M12 7c0-2 2-2 2-4"/>',viewFood],
 ['med','العلاج','<rect x="3" y="9" width="18" height="7" rx="3.5" transform="rotate(-35 12 12.5)"/><path d="M9.5 8.5l5 7"/>',viewMed],
 ['progress','التقدم','<path d="M4 19h16M6 15l4-4 3 3 5-6"/>',viewProgress]
];
function render(){
  const t=TABS.find(x=>x[0]===S.tab)||TABS[0];
  $('#app').innerHTML=t[3]();
  $('#tabs').innerHTML=TABS.map(x=>`<button data-tab="${x[0]}" ${x[0]===t[0]?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${x[2]}</svg>${x[1]}</button>`).join('');
}
function go(tab){S.tab=tab;save();render();window.scrollTo(0,0)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset,L=dayLog();
  if(d.tab) return go(d.tab);
  if(d.go) return go(d.go);
  if(d.energy){L.energy=+d.energy;save();return render()}
  if(d.water){const n=+d.water;L.water=L.water===n?n-1:n;save();return render()}
  if(d.mode){S.profile.mode=d.mode;save();return render()}
  if(d.day){selDay=+d.day;return render()}
  if(d.dellab){S.labs=S.labs.filter(l=>String(l.id)!==d.dellab);save();return render()}
  if(b.id==='addLab'){const tsh=$('#l-tsh').value.trim();if(!tsh){$('#l-tsh').focus();return}
    S.labs.push({id:Date.now(),d:$('#l-d').value||todayKey(),tsh,t4:$('#l-t4').value.trim()});save();return render()}
  if(b.id==='addW'){const w=parseFloat($('#w-w').value);if(!w){$('#w-w').focus();return}
    const dd=$('#w-d').value||todayKey();S.weights=S.weights.filter(x=>x.d!==dd);
    S.weights.push({d:dd,w,waist:$('#w-s').value.trim()});
    if(dd>=S.weights.map(x=>x.d).sort().slice(-1)[0])S.profile.weight=w;save();return render()}
});
document.addEventListener('change',e=>{
  const el=e.target,L=dayLog();
  if(el.dataset.med){L.med[el.dataset.med]=el.checked;save();return render()}
  if(el.dataset.ex){L.ex[el.dataset.ex]=el.checked;save();return render()}
  if(el.dataset.p){S.profile[el.dataset.p]=el.value;save()}
});

render();
})();
</script>
